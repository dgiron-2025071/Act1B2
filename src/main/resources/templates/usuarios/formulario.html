<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${usuario.codigoUsuario == 0} ? 'Nuevo Usuario' : 'Editar Usuario'">Usuario</title>
</head>
<body>
<div layout:fragment="content">
    <th:block th:with="titulo=${usuario.codigoUsuario == 0} ? 'Nuevo Usuario' : 'Editar Usuario'"/>

    <div class="card">
        <form th:action="@{/web/usuarios/guardar}" th:object="${usuario}" method="post">
            <input type="hidden" th:field="*{codigoUsuario}"/>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">Username *</label>
                        <input type="text" class="form-control" th:field="*{username}" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">Email *</label>
                        <input type="email" class="form-control" th:field="*{email}" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">Contraseña <span th:if="*{codigoUsuario != 0}">(dejar en blanco para no cambiar)</span></label>
                        <input type="password" class="form-control" th:field="*{password}" th:required="*{codigoUsuario == 0}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">Rol *</label>
                        <select class="form-control" th:field="*{rol}" required>
                            <option value="ADMIN">Administrador</option>
                            <option value="VENDEDOR">Vendedor</option>
                            <option value="CLIENTE">Cliente</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Estado</label>
                <select class="form-control" th:field="*{estado}">
                    <option value="1">Activo</option>
                    <option value="0">Inactivo</option>
                </select>
            </div>

            <div class="d-flex gap-2 justify-content-end mt-4">
                <a th:href="@{/web/usuarios}" class="btn btn-outline">Cancelar</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
