<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Programador</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card" style="max-width: 700px; margin: 0 auto;">
        <div class="text-center mb-4">
            <div style="width: 120px; height: 120px; background: var(--primary); border-radius: 50%; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; color: white; font-size: 3rem; font-weight: bold;">
                <span th:text="${#strings.substring(nombre, 0, 1)}">D</span>
            </div>
            <h2 th:text="${nombre}" style="color: var(--primary-dark);">Diego Girón</h2>
            <p class="badge badge-success" th:text="${carnet}">2025071</p>
        </div>

        <div class="row">
            <div class="col-12 mb-3">
                <i class="fas fa-envelope me-2" style="color: var(--primary);"></i>
                <strong>Correo:</strong> <span th:text="${correo}"></span>
            </div>
            <div class="col-12 mb-3">
                <i class="fab fa-github me-2" style="color: var(--primary);"></i>
                <strong>GitHub:</strong>
                <a th:href="${github}" target="_blank" th:text="${github}" style="color: var(--primary);"></a>
            </div>
            <div class="col-12 mb-3">
                <i class="fas fa-quote-right me-2" style="color: var(--secondary);"></i>
                <p th:text="${descripcion}" class="fst-italic"></p>
            </div>
            <div class="col-12">
                <i class="fas fa-code me-2" style="color: var(--accent-dark);"></i>
                <strong>Habilidades:</strong> <span th:text="${habilidades}"></span>
            </div>
        </div>

        <hr style="margin: 2rem 0;">

        <div class="text-center">
            <a th:href="@{/web/dashboard}" class="btn btn-outline me-2">
                <i class="fas fa-arrow-left"></i> Volver
            </a>
            <a href="#" class="btn btn-primary">
                <i class="fas fa-paper-plane"></i> Contactar
            </a>
        </div>
    </div>
</div>
</body>
</html>
