<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${cliente.DPICliente == null} ? 'Nuevo Cliente' : 'Editar Cliente'">Cliente</title>
</head>
<body>
<div layout:fragment="content">
    <th:block th:with="titulo=${cliente.DPICliente == null} ? 'Nuevo Cliente' : 'Editar Cliente'"/>

    <div class="card">
        <form th:action="@{/web/clientes/guardar}" th:object="${cliente}" method="post">
            <input type="hidden" th:field="*{DPICliente}" th:if="*{DPICliente != null}"/>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">DPI *</label>
                        <input type="text" class="form-control" th:field="*{DPICliente}"
                               required maxlength="13" th:readonly="*{DPICliente != null}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">Estado</label>
                        <select class="form-control" th:field="*{estado}">
                            <option value="1">Activo</option>
                            <option value="0">Inactivo</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">Nombre *</label>
                        <input type="text" class="form-control" th:field="*{nombreCliente}" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">Apellido *</label>
                        <input type="text" class="form-control" th:field="*{apellidoCliente}" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Dirección</label>
                <textarea class="form-control" th:field="*{direccion}" rows="2"></textarea>
            </div>

            <div class="d-flex gap-2 justify-content-end mt-4">
                <a th:href="@{/web/clientes}" class="btn btn-outline">Cancelar</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Guardar
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
