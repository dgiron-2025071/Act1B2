<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Detalle Cliente</title>
</head>
<body>
<div layout:fragment="content">
    <th:block th:with="titulo='Detalle del Cliente'"/>

    <div class="card">
        <div class="row">
            <div class="col-md-6">
                <p><strong>DPI:</strong> <span th:text="${cliente.DPICliente}"></span></p>
                <p><strong>Nombre:</strong> <span th:text="${cliente.nombreCliente}"></span></p>
                <p><strong>Apellido:</strong> <span th:text="${cliente.apellidoCliente}"></span></p>
            </div>
            <div class="col-md-6">
                <p><strong>Dirección:</strong> <span th:text="${cliente.direccion}"></span></p>
                <p><strong>Estado:</strong>
                    <span th:if="${cliente.estado == 1}" class="badge badge-success">Activo</span>
                    <span th:if="${cliente.estado == 0}" class="badge badge-danger">Inactivo</span>
                </p>
            </div>
        </div>
        <div class="mt-4">
            <a th:href="@{/web/clientes}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Volver</a>
            <a th:href="@{/web/clientes/editar/{dpi}(dpi=${cliente.DPICliente})}" class="btn btn-primary"><i class="fas fa-edit"></i> Editar</a>
        </div>
    </div>
</div>
</body>
</html>
