<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | KinalApp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-logo">
            <img th:src="@{/images/logoo.png}" alt="Kinal Logo" style="max-width: 120px; border-radius: 50%; padding: 8px; background: var(--accent);">
        </div>
        <h2 class="text-center mb-4" style="color: var(--primary-dark);">Crear Cuenta</h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/auth/registro}" th:object="${usuario}" method="post">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-user me-2"></i>Nombre de usuario *</label>
                <input type="text" th:field="*{username}" class="form-control" placeholder="Usuario" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fas fa-envelope me-2"></i>Correo electrónico *</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fas fa-lock me-2"></i>Contraseña *</label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 mt-3">
                <i class="fas fa-user-plus me-2"></i> Registrarse
            </button>
        </form>

        <p class="text-center mt-3">
            ¿Ya tienes cuenta? <a th:href="@{/auth/login}" style="color: var(--primary); font-weight: 500;">Inicia sesión aquí</a>
        </p>
        <p class="text-center mt-4 text-muted" style="color: var(--gray-600);">
            <i class="far fa-copyright me-1"></i> KinalApp 2026
        </p>
    </div>
</div>
</body>
</html>
