<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${producto.codigoProducto == 0} ? 'Nuevo Producto' : 'Editar Producto'">Producto</title>
</head>
<body>
<div layout:fragment="content">
    <th:block th:with="titulo=${producto.codigoProducto == 0} ? 'Nuevo Producto' : 'Editar Producto'"/>

    <div class="card">
        <form th:action="@{/web/productos/guardar}" th:object="${producto}" method="post">
            <input type="hidden" th:field="*{codigoProducto}"/>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">Nombre *</label>
                        <input type="text" class="form-control" th:field="*{nombreProducto}" required>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label class="form-label">Precio (Q) *</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{precio}" required>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label class="form-label">Stock *</label>
                        <input type="number" class="form-control" th:field="*{stock}" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Estado</label>
                <select class="form-control" th:field="*{estado}">
                    <option value="1">Activo</option>
                    <option value="0">Inactivo</option>
                </select>
            </div>

            <div class="d-flex gap-2 justify-content-end mt-4">
                <a th:href="@{/web/productos}" class="btn btn-outline">Cancelar</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Guardar
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
