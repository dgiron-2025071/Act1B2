<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Productos</title>
</head>
<body>
<div layout:fragment="content">
    <th:block th:with="titulo='Gestión de Productos'"/>

    <div class="filter-bar">
        <a th:href="@{/web/productos}" class="filter-btn" th:classappend="${param.estado == null} ? 'active'">Todos</a>
        <a th:href="@{/web/productos(estado=1)}" class="filter-btn" th:classappend="${param.estado == '1'} ? 'active'">Activos</a>
        <a th:href="@{/web/productos(estado=0)}" class="filter-btn" th:classappend="${param.estado == '0'} ? 'active'">Inactivos</a>
        <a th:href="@{/web/productos/nuevo}" class="btn btn-primary ms-auto">
            <i class="fas fa-plus-circle"></i> Nuevo Producto
        </a>
    </div>

    <div class="card">
        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="prod : ${productos}">
                    <td th:text="${prod.codigoProducto}"></td>
                    <td th:text="${prod.nombreProducto}"></td>
                    <td>Q <span th:text="${#numbers.formatDecimal(prod.precio, 0, 'COMMA', 2, 'POINT')}"></span></td>
                    <td th:text="${prod.stock}"></td>
                    <td>
                        <span th:if="${prod.estado == 1}" class="badge badge-success">Activo</span>
                        <span th:if="${prod.estado == 0}" class="badge badge-danger">Inactivo</span>
                    </td>
                    <td>
                        <div class="d-flex gap-2">
                            <a th:href="@{/web/productos/ver/{id}(id=${prod.codigoProducto})}" class="btn btn-outline btn-sm"><i class="fas fa-eye"></i></a>
                            <a th:href="@{/web/productos/editar/{id}(id=${prod.codigoProducto})}" class="btn btn-outline btn-sm"><i class="fas fa-edit"></i></a>
                            <a th:href="@{/web/productos/eliminar/{id}(id=${prod.codigoProducto})}" class="btn btn-danger btn-sm btn-delete"><i class="fas fa-trash"></i></a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${productos == null or productos.empty}">
                    <td colspan="6" class="text-center py-4">No hay productos registrados</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
