<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Detalle Producto</title>
</head>
<body>
<div layout:fragment="content">
    <th:block th:with="titulo='Detalle del Producto'"/>

    <div class="card">
        <div class="row">
            <div class="col-md-6">
                <p><strong>Código:</strong> <span th:text="${producto.codigoProducto}"></span></p>
                <p><strong>Nombre:</strong> <span th:text="${producto.nombreProducto}"></span></p>
                <p><strong>Precio:</strong> Q <span th:text="${#numbers.formatDecimal(producto.precio, 0, 'COMMA', 2, 'POINT')}"></span></p>
            </div>
            <div class="col-md-6">
                <p><strong>Stock:</strong> <span th:text="${producto.stock}"></span></p>
                <p><strong>Estado:</strong>
                    <span th:if="${producto.estado == 1}" class="badge badge-success">Activo</span>
                    <span th:if="${producto.estado == 0}" class="badge badge-danger">Inactivo</span>
                </p>
            </div>
        </div>
        <div class="mt-4">
            <a th:href="@{/web/productos}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Volver</a>
            <a th:href="@{/web/productos/editar/{id}(id=${producto.codigoProducto})}" class="btn btn-primary"><i class="fas fa-edit"></i> Editar</a>
        </div>
    </div>
</div>
</body>
</html>
