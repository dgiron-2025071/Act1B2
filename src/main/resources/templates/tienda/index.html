<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Tienda</title>
</head>
<body>
<div layout:fragment="content">
    <th:block th:with="titulo='Nuestros Productos'"/>

    <div class="product-grid">
        <div class="product-card" th:each="prod : ${productos}">
            <div class="product-image">
                <i class="fas fa-box-open fa-3x"></i>
            </div>
            <div class="product-info">
                <h3 th:text="${prod.nombreProducto}">Producto</h3>
                <div class="product-price">Q <span th:text="${#numbers.formatDecimal(prod.precio, 0, 'COMMA', 2, 'POINT')}"></span></div>
                <p class="mb-3">Stock: <span th:text="${prod.stock}">0</span> unidades</p>
                <div class="d-flex gap-2">
                    <a th:href="@{/tienda/producto/{id}(id=${prod.codigoProducto})}" class="btn btn-outline btn-sm flex-grow-1">
                        <i class="fas fa-eye"></i> Ver
                    </a>
                    <form th:action="@{/carrito/agregar}" method="post" style="display: contents;">
                        <input type="hidden" name="idProducto" th:value="${prod.codigoProducto}">
                        <input type="hidden" name="cantidad" value="1">
                        <button type="submit" class="btn btn-primary btn-sm">
                            <i class="fas fa-cart-plus"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:if="${productos == null or productos.empty}" class="text-center py-5">
        <i class="fas fa-box-open fa-4x mb-3" style="color: var(--gray-400);"></i>
        <h3>No hay productos disponibles</h3>
    </div>
</div>
</body>
</html>
